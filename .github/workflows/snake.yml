# Snake — renders the contribution-grid animation.
#
# Trigger: every 6 hours (offset from Metrics), on push to main, or manually.
# Secret:  none beyond the built-in GITHUB_TOKEN.
# Output:  snake-light.svg / snake-dark.svg published to the "output" branch,
#          which the README references by raw URL.
name: Snake

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e85d3a&color_dots=#1a1a1a,#4a2418,#8a3a22,#c04c2c,#e85d3a
            dist/snake-light.svg?palette=github-light&color_snake=#e85d3a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

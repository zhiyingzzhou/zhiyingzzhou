      - name: Publish metrics assets
        run: |
          render_dir="$(mktemp -d)"
          sudo cp /metrics_renders/assets/*.svg "$render_dir"/
          sudo chown -R "$(id -u):$(id -g)" "$render_dir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD

            mkdir -p assets
            cp "$render_dir"/*.svg assets/
            git add assets/metrics-*.svg

            if git diff --quiet --cached; then
              echo "Metrics assets are already up to date."
              exit 0
            fi

            git commit -m "chore: update metrics assets [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed on attempt $attempt; retrying from latest origin/main."
          done

          echo "Failed to publish metrics assets after 3 attempts."
          exit 1

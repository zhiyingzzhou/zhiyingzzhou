# Metrics — renders the profile dashboard SVGs.
#
# Trigger: every 6 hours, on push to main, or manually (Actions > Metrics > Run workflow).
# Secret:  METRICS_TOKEN — a classic PAT with public_repo (or repo) + read:user + read:org.
# Output:  assets/metrics-*-light.svg and assets/metrics-*-dark.svg, committed once after all renders succeed.
# Note:    the README only changes after this workflow has run at least once.
name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: profile-main-writer-${{ github.ref }}
  queue: max

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overview panel (light)
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zhiyingzzhou
          filename: assets/metrics-overview-light.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_display: large
          config_timezone: Asia/Shanghai
          extras_css: |
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700");
            @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700");
            :root {
              --color-calendar-graph-day-bg: #f6f8fa;
              --color-calendar-graph-day-border: #d1d9e0;
              --color-calendar-graph-day-L1-bg: #fbdccf;
              --color-calendar-graph-day-L2-bg: #f4a288;
              --color-calendar-graph-day-L3-bg: #e85d3a;
              --color-calendar-graph-day-L4-bg: #b83b18;
              --color-text-default: #1f2328;
              --color-text-primary: #1f2328;
              --color-text-secondary: #59636e;
              --color-text-muted: #59636e;
              --color-calendar-halloween-graph-day-L1-bg: #fbdccf;
              --color-calendar-halloween-graph-day-L2-bg: #f4a288;
              --color-calendar-halloween-graph-day-L3-bg: #e85d3a;
              --color-calendar-halloween-graph-day-L4-bg: #b83b18;
            }
            svg, body, .items-wrapper, foreignObject > * { background: #ffffff !important; }
            .background {
              fill: #ffffff !important;
              stroke: #d1d9e0 !important;
              stroke-width: 1px !important;
              rx: 12px !important;
              ry: 12px !important;
              filter: none !important;
            }
            body, .items-wrapper, .items-wrapper section, .row, .row .field, .row .field * {
              font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace !important;
              color: #1f2328 !important;
            }
            .row .field, .row .field * { font-size: 12px !important; }
            .items-wrapper section > h2.field, .items-wrapper section > h2.field * {
              font-family: "Space Grotesk", system-ui, sans-serif !important;
              color: #d2451e !important;
              font-weight: 700 !important;
              letter-spacing: .02em !important;
            }
            .items-wrapper section > h1.field, .items-wrapper section > h1.field * {
              font-family: "Space Grotesk", system-ui, sans-serif !important;
              color: #d2451e !important;
              font-weight: 700 !important;
            }
            .items-wrapper section:first-of-type > .row .field,
             .items-wrapper section:first-of-type > .row .field * {
              color: #59636e !important;
            }
            .avatar {
              border: 1px solid #d1d9e0 !important;
              border-radius: 50% !important;
            }
            .row .field > svg, .row .field > svg path, .row .field svg.octicon path {
              fill: #59636e !important;
              color: #59636e !important;
            }
            .items-wrapper section > h2.field > svg,
             .items-wrapper section > h2.field > svg path {
              fill: #d2451e !important;
              color: #d2451e !important;
            }
            rect[fill="#ebedf0"], rect[fill="#EBEDF0"], path[fill="#ebedf0"],
             rect.day[fill="#ebedf0"], rect.day[fill="#EBEDF0"] { fill: #f6f8fa !important; }
            [style*="#ebedf0"] { background-color: #f6f8fa !important; }
            rect[fill="#eff2f5"], rect[fill="#EFF2F5"], path[fill="#eff2f5"],
             rect.day[fill="#eff2f5"], rect.day[fill="#EFF2F5"] { fill: #f6f8fa !important; }
            [style*="#eff2f5"] { background-color: #f6f8fa !important; }
            rect[fill="#161b22"], rect[fill="#161B22"], path[fill="#161b22"],
             rect.day[fill="#161b22"], rect.day[fill="#161B22"] { fill: #f6f8fa !important; }
            [style*="#161b22"] { background-color: #f6f8fa !important; }
            rect[fill="#9be9a8"], rect[fill="#9BE9A8"], path[fill="#9be9a8"],
             rect.day[fill="#9be9a8"], rect.day[fill="#9BE9A8"] { fill: #fbdccf !important; }
            [style*="#9be9a8"] { background-color: #fbdccf !important; }
            rect[fill="#0e4429"], rect[fill="#0E4429"], path[fill="#0e4429"],
             rect.day[fill="#0e4429"], rect.day[fill="#0E4429"] { fill: #fbdccf !important; }
            [style*="#0e4429"] { background-color: #fbdccf !important; }
            rect[fill="#40c463"], rect[fill="#40C463"], path[fill="#40c463"],
             rect.day[fill="#40c463"], rect.day[fill="#40C463"] { fill: #f4a288 !important; }
            [style*="#40c463"] { background-color: #f4a288 !important; }
            rect[fill="#006d32"], rect[fill="#006D32"], path[fill="#006d32"],
             rect.day[fill="#006d32"], rect.day[fill="#006D32"] { fill: #f4a288 !important; }
            [style*="#006d32"] { background-color: #f4a288 !important; }
            rect[fill="#30a14e"], rect[fill="#30A14E"], path[fill="#30a14e"],
             rect.day[fill="#30a14e"], rect.day[fill="#30A14E"] { fill: #e85d3a !important; }
            [style*="#30a14e"] { background-color: #e85d3a !important; }
            rect[fill="#26a641"], rect[fill="#26A641"], path[fill="#26a641"],
             rect.day[fill="#26a641"], rect.day[fill="#26A641"] { fill: #e85d3a !important; }
            [style*="#26a641"] { background-color: #e85d3a !important; }
            rect[fill="#216e39"], rect[fill="#216E39"], path[fill="#216e39"],
             rect.day[fill="#216e39"], rect.day[fill="#216E39"] { fill: #b83b18 !important; }
            [style*="#216e39"] { background-color: #b83b18 !important; }
            rect[fill="#39d353"], rect[fill="#39D353"], path[fill="#39d353"],
             rect.day[fill="#39d353"], rect.day[fill="#39D353"] { fill: #b83b18 !important; }
            [style*="#39d353"] { background-color: #b83b18 !important; }
            rect.day, .calendar rect, .isocalendar rect, [class*="contribution"] rect {
              stroke: none !important;
              outline: none !important;
            }
            .item { padding: 4px 2px !important; }
            section { margin-bottom: 6px !important; }

